# bc250_memory reads GDDR6 temperatures by patching the SMU at runtime and
# then sending SMU Queue 3 messages. Nothing autoloads it (no module alias),
# which is deliberate: a load with auto_patch=1 writes into SMU RAM, and the
# SMU index/data pair at 0xB8/0xBC on 00:00.0 is shared with the GPU governor
# (cyan-skillfish-governor-smu) and the CPU OC tool. The driver takes no lock
# on that pair, so sampling next to the governor can wedge the SMU.
#
# Load it by hand only, and only with the governor settled (>5 s after its
# start) and no other SMU client active. On stock P3.00 (no SMU-unlock BIOS
# mod) auto_patch cannot open the SMU debug gate and the probe bails with
# "BIOS unlock required".
options bc250_memory auto_patch=0
