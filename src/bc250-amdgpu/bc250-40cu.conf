# Clear the harvest mask and open SPI dispatch to all 40 CUs at amdgpu
# init (BC-250, 1002:13fe, only). Cap the governor at 1500 MHz first:
# at 2 GHz a 40 CU board reaches TJmax within minutes.
# To turn it off without removing the package, create
# /etc/modprobe.d/50-bc250-40cu.conf containing
#   options amdgpu bc250_cc_write_mode=0
# then run: sudo dracut -f --regenerate-all
options amdgpu bc250_cc_write_mode=3
